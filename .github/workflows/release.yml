name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to create, e.g. v1.0.0 (leave empty to only build)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      # The project targets VS 2026 (v145). GitHub's runner ships an older toolset, so override it here.
      - name: Build x64
        run: msbuild DiscordRichPresence.sln -m -p:Configuration=Release -p:Platform=x64 -p:PlatformToolset=v143

      - name: Build x86
        run: msbuild DiscordRichPresence.sln -m -p:Configuration=Release -p:Platform=x86 -p:PlatformToolset=v143

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pkg/x64/plugins, pkg/x32/plugins | Out-Null
          Copy-Item bin/x64/Release/DiscordRichPresence.dp64 pkg/x64/plugins/
          Copy-Item bin/Win32/Release/DiscordRichPresence.dp32 pkg/x32/plugins/
          Copy-Item README.md pkg/
          Compress-Archive -Path pkg/* -DestinationPath x64dbg-DiscordRichPresence.zip

      - uses: actions/upload-artifact@v4
        with:
          name: x64dbg-DiscordRichPresence
          path: x64dbg-DiscordRichPresence.zip

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/') || inputs.version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.version }}
        run: gh release create "$TAG" x64dbg-DiscordRichPresence.zip --target "${{ github.sha }}" --title "$TAG" --generate-notes
